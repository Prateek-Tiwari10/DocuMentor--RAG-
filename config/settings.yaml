corpus:
  repo: https://github.com/langchain-ai/docs.git
  branch: main
  paths: [src/oss/langgraph, src/oss/concepts, src/snippets/code-samples]
  page_dirs: [src/oss/langgraph, src/oss/concepts]
  snippet_dir: src/snippets/code-samples
  raw_dir: data/raw/langchain-docs
  clean_dir: data/clean
  url_base: https://docs.langchain.com/oss   # + /python/... or /javascript/...
  languages: [python, js]
  default_language: python
  url_segment: {python: python, js: javascript}
  min_view_tokens: 50

embedding:
  model: BAAI/bge-m3
  fast_model: sentence-transformers/all-MiniLM-L6-v2
  tokenizer: BAAI/bge-m3
  batch_size: 16
  device: auto            # auto -> cuda if available else cpu

chunking:
  strategy: parent_child  # recursive | parent_child
  prepend_headings: true  # prefix "Page > H2 > H3" to the text that gets embedded
  heading_break_ratio: 0.6
  recursive:
    size: 500
    overlap: 75
  parent_child:
    child_size: 200
    child_overlap: 30
    parent_max: 1500
    child_top_k: 20       # children fetched before grouping into parents

store:
  chroma_path: data/chroma
  parents_path: data/parents
  batch_size: 1000

retrieval:
  top_k: 5
  strategy: recursive            # default for search() and the pipeline

llm:
  provider: groq
  model: openai/gpt-oss-120b
  temperature: 0.5               # Groq recommends 0.5–0.7 for reasoning models
  reasoning_effort: low          # low | medium | high
  max_completion_tokens: 1500    # includes reasoning tokens
  timeout_s: 60
  max_retries: 5
  tpm_limit: 8000                # free plan; raise if your org limit is higher
  cache: true
  cache_path: data/cache/llm

generation:
  context_max_tokens: 3000
  budget_encoding: o200k_base    # tiktoken encoding used to count prompt tokens
  refusal_sentinel: NOT_IN_DOCS
  refusal_message: "I couldn't find this in the LangGraph documentation."
  min_score: null                # retrieval pre-check; null = off until calibrated

logging:
  query_log: data/logs/queries.jsonl

evaluation:
  judge_candidates: [openai/gpt-oss-20b, openai/gpt-oss-120b]
  judge_model: openai/gpt-oss-120b              # set by Step 4 calibration
  judge_base_url: https://api.groq.com/openai/v1
  judge_reasoning_effort: low    # if the RAGAS LLM wrapper can pass it through
  judge_max_tokens: 3000         # 2048 truncated long closed-book answers; prompt + this must stay under judge_tpm_limit
  judge_temperature: 0
  judge_max_retries: 6
  judge_tpm_limit: 8000          # per-minute limit; waits, never stops the run
  judge_tokens_per_day: 200000   # Groq per-day limit, used for the projection
  judge_min_requests_left: 5     # stop before the 1,000 requests/day limit
  budget_max_wait_s: 120         # a longer retry wait means a per-day limit
  cutoffs: {Y: 0.8, P: 0.7}    # set by Step 4 calibration
  calibrated: false               # set by Step 4 calibration
  trust_agreement: 0.80
  trust_kappa: 0.60
  ragas_cache_path: data/cache/ragas
  golden_path: eval/mini_golden.jsonl
  oos_path: eval/oos.jsonl
  human_sheet: eval/results/phase2_20261103_1508_review.md
  baseline_path: eval/baselines/phase3.json
  strategy_rule: {min_question_gain: 2, max_faithfulness_drop: 0.05}
  strategy_deferred: "Answer-level strategy comparison deferred to Phase 4 (after the reranker). Current evidence is retrieval only, from the 20-question run on 2026-11-03: R@5 0.75 recursive vs 0.90 parent_child, with parent_child returning about 75% more tokens."
  daily_budget_days_max: 3
